# SQL Server for running the project on macOS or Linux, or on Windows without SQL Express.
# For local use only: this password is not a secret. It matches the "docker" launch profile
# in backend/SterlingGrove.Api/Properties/launchSettings.json.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SterlingGrove!Dev2026"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  sql-data:
