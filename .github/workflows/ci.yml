name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test backend/SterlingGrove.Api.Tests

  frontend:
    name: Website build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  smoke:
    name: API starts against SQL Server in Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: docker compose up -d --wait
      - name: Start the API and check it seeded the site
        working-directory: backend/SterlingGrove.Api
        run: |
          dotnet run --launch-profile docker > api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5097/api/faculties | grep -q engineering-technology; then
              echo "API is up and the site is seeded"
              curl -sf -X POST http://localhost:5097/api/auth/login -H 'Content-Type: application/json' \
                -d '{"email":"admin@sterlinggrove.edu","password":"Falcons!2026"}' > /dev/null
              echo "Demo admin can sign in"
              exit 0
            fi
            sleep 3
          done
          cat api.log
          exit 1
